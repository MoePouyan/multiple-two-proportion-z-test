[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path serves the built index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The tool is embedded on moepouyan.com as an iframe, so framing must stay allowed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://www.moepouyan.com https://moepouyan.com https://*.squarespace.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
